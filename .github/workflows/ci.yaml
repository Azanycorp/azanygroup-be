name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, analyse, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Larastan reads model columns from the database schema, so the throwaway
      # SQLite database has to exist and be migrated before the analysis step.
      # It doubles as proof that the migrations run on SQLite as well as MySQL.
      - name: Migrate a throwaway database
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Coding style (Pint)
        run: vendor/bin/pint --test

      - name: Automated refactors (Rector)
        run: vendor/bin/rector process --dry-run

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (Pest)
        run: php artisan test --parallel
